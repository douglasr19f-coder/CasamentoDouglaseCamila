<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Painel dos noivos</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Montserrat,Arial,sans-serif;background:#F8F9F7;color:#2C332A;padding:20px}
.w{max-width:820px;margin:0 auto}h1{color:#38461E;font-family:Georgia,serif}
.c{background:#fff;border:1px solid #dfe1c9;border-radius:14px;padding:18px;margin-bottom:16px}
input,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid #ccc}input{width:100%}
button{background:#556B2F;color:#fff;border:0;cursor:pointer}button.x{background:#a33;padding:5px 10px}button.g{background:#fff;color:#556B2F;border:1px solid #556B2F}
.r{display:flex;gap:8px;flex-wrap:wrap}.r>input{flex:1;min-width:160px;width:auto}
.k{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center}.k b{display:block;font-size:1.8rem;color:#38461E}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:.92rem}
.s-Confirmado{color:#2a7a2a;font-weight:700}.s-Nao{color:#a33;font-weight:700}.s-Pendente{color:#888}
@media(max-width:560px){.k{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="w">
<h1>Painel dos noivos</h1>
<div class="c" id="login"><div class="r"><input type="password" id="pw" placeholder="Senha"><button onclick="carregar()">Entrar</button></div><p id="err" style="color:#a33;margin:8px 0 0"></p></div>
<div id="painel" style="display:none">
 <div class="c k"><div><b id="kT">0</b>Convidados</div><div><b id="kC">0</b>Confirmados</div><div><b id="kN">0</b>Não vão</div><div><b id="kP">0</b>Pendentes</div></div>
 <div class="c"><div class="r"><input id="novo" placeholder="Adicionar convidado (nome completo)"><button onclick="add()">Adicionar</button></div></div>
 <div class="c"><div class="r" style="margin-bottom:10px"><input id="q" placeholder="Buscar..." oninput="desenha()"><button class="g" onclick="filtro='';desenha()">Todos</button><button class="g" onclick="filtro='Confirmado';desenha()">Confirmados</button><button class="g" onclick="filtro='Pendente';desenha()">Pendentes</button><button class="g" onclick="filtro='Não vai';desenha()">Não vão</button></div>
 <div style="overflow-x:auto"><table><thead><tr><th>Nome</th><th>Status</th><th>Quando</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div>
</div>
<script>
// Cole aqui o MESMO endereço do Apps Script usado no index.html
var APPS_URL="https://script.google.com/macros/s/AKfycbzVBPeUsjloq_mBVrU77MHXRE65OOHtRezRU6I6m2WQapUODPGoycYkS9PadP5Rgcki/exec";
var dados=[],filtro="",senha="";
function api(q){return fetch(APPS_URL+"?"+q+"&senha="+encodeURIComponent(senha)).then(function(r){return r.json()})}
function carregar(){senha=document.getElementById("pw").value;err.textContent="";
 if(!APPS_URL){err.textContent="Falta colar o endereço do Apps Script neste arquivo.";return}
 api("action=admin").then(function(d){if(!d.ok){err.textContent=d.erro||"Erro";return}
  dados=d.convidados;login.style.display="none";painel.style.display="block";desenha()}).catch(function(){err.textContent="Erro de conexão."})}
function norm(t){return t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
function desenha(){
 kT.textContent=dados.length;kC.textContent=dados.filter(function(x){return x.status=="Confirmado"}).length;
 kN.textContent=dados.filter(function(x){return x.status=="Não vai"}).length;kP.textContent=dados.filter(function(x){return x.status=="Pendente"}).length;
 var q=norm(document.getElementById("q").value);
 tb.innerHTML=dados.filter(function(x){return(!filtro||x.status==filtro)&&norm(x.nome).indexOf(q)>-1}).map(function(x,i){
  return"<tr><td>"+x.nome+"</td><td class='s-"+(x.status=='Não vai'?'Nao':x.status)+"'>"+x.status+"</td><td>"+x.data+"</td><td><button class='x' data-n=\""+x.nome.replace(/"/g,"&quot;")+"\">Remover</button></td></tr>"}).join("")}
tb.onclick=function(e){var n=e.target.getAttribute("data-n");if(!n||!confirm("Remover "+n+" da lista?"))return;api("action=del&nome="+encodeURIComponent(n)).then(carregar)};
function add(){var n=novo.value.trim();if(!n)return;api("action=add&nome="+encodeURIComponent(n)).then(function(){novo.value="";carregar()})}
</script></div></body></html>
